name: Daily News Generator

on:
  schedule:
    # 使用 Cron 表达式设置定时任务
    # UTC 0:00 相当于北京/香港时间早上 8:00
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许你在网页上手动点击运行，方便测试

# 必须赋予 Action 读写仓库代码的权限，才能把 docs 里的文件推送到仓库
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 拉取仓库代码
        uses: actions/checkout@v4

      - name: 2. 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 运行 Python 脚本生成文件
        run: python generate_news.py

      - name: 4. 提交并推送生成的 docs 文件夹
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/
          # 检查是否有文件发生变动，如果有则提交，如果没有则跳过
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generate daily news [skip ci]" && git push)
